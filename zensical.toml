[project]
site_name = "vpmobil-py Dokumentation"
site_url = "https://annhilati.github.io/vpmobil-py"
repo_url = "https://github.com/annhilati/vpmobil-py"
repo_name = "vpmobil-py"
nav = [
    {"Nutzer" = [
        "README.md",
        {"Getting Started" = [
            "getting-started/vertretungsplandaten-abrufen.md"
        ]},
        {"Anderes" = [
            "anderes/changelog.md",
            "anderes/credits.md"
        ]},
    ]},
    {"Reverse Engineering" = [
        "anderes/indiware.md",
    ]}
]
extra_css = ["style.css"]

[project.theme]
features = [
    "navigation.sections",
    "navigation.tabs"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "custom"

[project.extra]
generator = false

[project.markdown_extensions]
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true }
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg", options.custom_icons = ["overrides/.icons"] }
admonition = {}
footnotes = {}
attr_list = {}
md_in_html = {}